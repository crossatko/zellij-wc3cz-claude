[package]
name = "claude-tabs"
version = "0.1.0"
edition = "2021"

[dependencies]
zellij-tile = "0.45.1"
zellij-tile-utils = "0.45.1"
ansi_term = "0.12"
unicode-width = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
